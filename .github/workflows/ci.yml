# Fast tier — the merge contract (ADR-0109 §4, §6).
#
# Runs on every push and PR: lint, format check, pyright islands, and the
# fast test tier. Lint and typecheck run once, on Ubuntu 24.04 with Python
# 3.11 (the requires-python floor). The fast tier runs on the reference
# platforms the README names: Ubuntu 24.04 with Python 3.11 and 3.13, and
# macOS 26 with Python 3.13 (Windows is supported through WSL2 only).
# Runner images are pinned by name and actions by commit SHA;
# .github/dependabot.yml proposes the action updates.
#
# The fast tier runs WITHOUT a database:
#   * tests/repositories, tests/services, tests/auth, tests/web are
#     ignored explicitly (DB-heavy; covered by full-suite.yml),
#   * any remaining DB-bound test self-skips by fixture design
#     (tests/_db_fixtures._require_db_urls),
#   * tests/regression stays IN: the purity-guard family runs without a
#     database; only the migration-roundtrip files self-skip.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pyright (typing islands)
        run: pyright

  fast-tests:
    name: fast-tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.13"
          - os: macos-26
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fast test tier (no database)
        run: >
          pytest -m "not integration and not timing"
          --ignore=tests/repositories
          --ignore=tests/services
          --ignore=tests/auth
          --ignore=tests/web

# Full suite — main pushes and manual dispatch (ADR-0109 §4).
#
# Postgres 16 service container; the app role is applied via psql after
# checkout (service containers cannot mount repo files), then Alembic
# migrates to head. The regression-guard and migration-roundtrip family
# runs as the FINAL named step: it is the public architectural contract,
# and the roundtrip suites leave the schema downgraded (Strand-1 closure
# §5) — nothing may depend on the database after it.
#
# continue-on-error is false. Until the flake-fix run (Chat D, #052
# gate 6) lands, TWO known flake signatures are rerun-once exceptions
# (ADR-0109 §4): the migration-roundtrip downgrade and AI-service
# singleton pollution in combined runs. A failure matching one of them
# is re-dispatched ONCE via workflow_dispatch before being treated as
# red. Any other failure is red immediately.
name: Full suite

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-suite
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: portfoliflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfoliflow_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://portfoliflow_app:app_dev_password_change_me@localhost:5432/portfoliflow_dev
      DATABASE_URL_SUPERUSER: postgresql+asyncpg://postgres:postgres_ci@localhost:5432/portfoliflow_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Create application role
        # Same script the compose container applies on first start; the
        # role password is the dev literal referenced by DATABASE_URL.
        run: >
          psql "postgresql://postgres:postgres_ci@localhost:5432/portfoliflow_dev"
          -v ON_ERROR_STOP=1
          -f db/init/01-create-app-role.sql
      - name: Apply migrations
        run: alembic -c db/alembic.ini upgrade head
      - name: Full suite (minus regression)
        run: pytest -m "not integration and not timing" --ignore=tests/regression
      - name: Regression guards & migration roundtrips
        run: pytest -m "not integration and not timing" tests/regression

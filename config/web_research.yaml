# PortfoliFLOW — Web Research Allowlist (ADR-0023, ADR-0024)
#
# This file enumerates every domain the Web Research capability is permitted
# to fetch from, and every RSS/Atom feed it may poll for candidate articles.
# It is audit-relevant: a reviewer must be able to read this file in full
# and understand exactly which external sources the system may query on
# Shirley's behalf, and over what time window.
#
# -----------------------------------------------------------------------------
# Schema
# -----------------------------------------------------------------------------
#
# Top-level:
#
#   default_window_hours  (positive int, required) — global default time
#                            window applied to feed items. Items whose
#                            publication timestamp is older than this
#                            window (or whose per-source override, if any)
#                            are dropped from the candidate pool. A
#                            per-source override, if present, always wins.
#
#   sources               (list, required, non-empty) — allowlist entries.
#
# Each entry under `sources` has:
#
#   domain        (string, required) — exact hostname. v1 does NOT support
#                    wildcards or regex; subdomains must be listed
#                    explicitly as their own entries.
#   name          (string, required) — human-readable name used in logs
#                    and in each FeedItem's `source_name` field.
#   added_on      (ISO date, required) — when this entry was added. Used
#                    for change-log review.
#   rationale     (string, required) — one-line reason this source belongs
#                    on the list. Appears in audit review.
#   feeds         (list of strings, required, non-empty) — RSS/Atom feed
#                    URLs to poll for candidate articles. Each feed URL's
#                    hostname must itself be present as a `domain` in this
#                    file (checked at load time); a feed URL on a
#                    non-allowlisted host is a configuration error and
#                    will fail to load.
#   window_hours  (positive int, optional) — overrides
#                    `default_window_hours` for this source only.
#   tags          (list of strings, optional) — curated, source-level
#                    bucket dimensions for Irene's deterministic RSS
#                    clustering (ADR-0087 Part B). Multi-valued: a source
#                    may carry several tags (e.g. the ECB is both `macro`
#                    and `regulator`). Each tag MUST come from the closed
#                    vocabulary enumerated below; a typo fails the load.
#                    Tags are normalised to lowercase and de-duplicated. A
#                    missing `tags` key means the source is untagged; its
#                    items cluster under a reserved `untagged` dimension
#                    (never dropped). Tags are the bucket dimension by
#                    design — cross-source events merge by shared tag, not
#                    by source name.
#
#   Closed tag vocabulary (must match services/web_research/allowlist.py
#   `_KNOWN_TAGS`):
#       macro | regulator | equities | credit | real_estate |
#       private_markets | swiss_finance
#
# -----------------------------------------------------------------------------
# How to add an entry
# -----------------------------------------------------------------------------
#
# 1. Confirm the source is an institutional financial news, research, or
#    regulator outlet — not a social-media aggregator, user-generated-content
#    site, or general search engine. The two-stage Fetcher-LLM mitigates
#    injection but does not eliminate it; the curated list is the first
#    line of defence.
# 2. Verify the feed URL in a browser (or via `curl`) before commit:
#       - HTTP 200
#       - Content-Type indicates RSS, Atom, or XML
#       - Body is parseable by `feedparser`
#       - Items carry a usable `pubDate` / `updated` field
#    The previous resolution mechanism shipped URLs that had not been
#    verified against reality, which is what drove ADR-0024. Do not repeat
#    that.
# 3. Add a new entry under `sources`. Populate every required field.
#    Keep the list sorted by `domain` for reviewable diffs.
# 4. If the feed URL hostname differs from the entry's `domain`, add a
#    separate entry for that hostname as well (its `feeds` list may point
#    to the same URL). The load-time validator will reject a feed URL
#    whose host is not on the list.
# 5. Commit the change on its own; do not bundle with unrelated edits.
#
# See ADR-0024 ("RSS-based Source Resolution for Web Research") for the
# rationale, and ADR-0022 ("Tool Trust Classes and Gating Policy") and
# ADR-0023 ("Web Research Capability") for the broader architecture.
#
# -----------------------------------------------------------------------------
# Sources not currently included (and why)
# -----------------------------------------------------------------------------
#
# Reuters, Bloomberg — public RSS endpoints are behind bot-detection
#     (Cloudflare / datadome) and return HTTP 401/403 to any programmatic
#     request. Out of reach under the no-detection-evasion policy of
#     ADR-0024.
# BaFin, Deutsche Bundesbank — no public RSS endpoints located at the time
#     of writing; all documented URL patterns return HTTP 404. Revisit if
#     the respective websites publish a feed.
# Handelsblatt — the public feed URL redirects off-domain to a CDN host
#     (feeds.cms.handelsblatt.com). Including it cleanly requires two
#     allowlist entries (article domain + feed CDN). Deferred pending a
#     future refactor that warrants the extra complexity.
# Financial Times — included. Note that many FT articles are paywalled at
#     the article body; trafilatura may yield short extractions and the
#     Fetcher-LLM will then skip with a WARNING. That is expected
#     behaviour for a paywalled source.
# IMF — no verifiable machine-readable news feed found (2026-08-15):
#     www.imf.org/en/news/rss returns Content-Type text/html (an RSS
#     landing page, not a feed). Fails verification step 2. Revisit if
#     the IMF publishes a direct XML endpoint.
# EIOPA — despite high relevance for the Versorgungswerk audience
#     (IORP II / Solvency II), no general news RSS endpoint could be
#     verified (2026-08-15); only a niche RFR technical-files feed exists
#     on a dynamic page. Revisit — this would be a high-value addition.
# NZZ — technically working feeds (e.g. www.nzz.ch/wirtschaft.rss), but
#     NZZ's RSS terms explicitly prohibit commercial use of their feeds
#     without permission. Excluded on licensing grounds, not technical
#     ones (2026-08-15). Revisit only with a syndication agreement.
# AltAssets (private-equity news) — homepage carries injected third-party
#     spam content as of 2026-08-15, indicating a compromised site.
#     Excluded on injection-risk grounds per ADR-0022/0023.
# finews.ch — REMOVED 2026-08-15. The former Joomla feed URL
#     (/news/finanz-blogs/rss/1finews) stopped resolving (operator-confirmed
#     in production); current directories only list feeds for the English
#     sister site finews.com. finews.ch additionally disallows automated
#     access via robots.txt. Consequence: the `swiss_finance` tag dimension
#     currently has NO source. Candidate replacement: finews.com
#     English-news feed — pending operator verification via `curl`.
#
# Re-verification log (2026-08-15), existing entries:
#     Verified OK: ECB (rss/press.html), ESMA (rss.xml — but see pubDate
#         caveat at its entry), Yahoo Finance (news/rssindex; note the feed
#         mixes in evergreen personal-finance items with old pubDates, which
#         the window filter drops by design).
#     Not re-verifiable with the tooling used for this revision: BIS and
#         CNBC (robots.txt / bot-detection against this reviewer's fetcher —
#         not necessarily against the production feedparser client) and FT
#         (fetch blocked). These entries are retained; operator should
#         re-verify via `curl` at next convenience, since CNBC's bot
#         protection MAY now also affect programmatic feed access.
# The Economist, IPE / IPE Real Assets, FT section feeds (Markets,
#     Private Equity), MarketWatch — plausible candidates whose feed URLs
#     could NOT be verified end-to-end with the tooling available when
#     this revision was prepared (fetch blocked, HTTP 405, or feed host
#     off-domain). Per step 2 above they are deliberately NOT included
#     unverified. Candidate URLs are recorded in the accompanying
#     research summary for operator verification via `curl`.

default_window_hours: 200

sources:


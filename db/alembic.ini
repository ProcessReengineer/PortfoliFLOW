# Alembic configuration for PortfoliFLOW.
#
# The connection URL is intentionally omitted from this file. env.py
# loads `.env` (via python-dotenv) and reads `DATABASE_URL_SUPERUSER`
# at runtime. Migrations always run as the Postgres superuser because
# DDL needs ownership; the application's portfoliflow_app role can
# read and write but cannot apply DDL.

[alembic]
# Path to migration scripts. %(here)s expands to the directory of this
# alembic.ini file, so the path is independent of the caller's CWD.
script_location = %(here)s/migrations

# Template used when generating new revision files.
# %%(year)d-%%(month).2d-%%(day).2d_%%(slug)s would also work; we use
# a UTC-stamped slug so revisions are sortable.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone for the file_template stamp. UTC keeps revisions consistent
# across contributor machines.
timezone = UTC

# Don't truncate the slug.
truncate_slug_length = 60

# When True, allow Alembic to look for migration scripts in subfolders
# of script_location. We keep all migrations in versions/ so this stays
# off.
recursive_version_locations = false

# Path separator used by version_locations. Defaults to os, which is
# fine for our single-versions-dir setup.
version_path_separator = os

# Output encoding for generated migration files.
output_encoding = utf-8

# sqlalchemy.url is read from the environment in env.py.
# Leaving it blank here forces env.py to be the only source.
sqlalchemy.url =


[post_write_hooks]
# No post-write hooks in Phase 1. A future entry could run ruff-format
# over generated migrations; not needed yet.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

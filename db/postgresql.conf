# PostgreSQL configuration overrides for PortfoliFLOW.
#
# Phase 1: minimal — only the directives required for the container
# port-mapping to work. Postgres defaults apply for everything else.
# Future tuning will be added here as deployment-mode-specific needs arise:
#   - Phase 3: performance tuning (e.g. shared_buffers, work_mem)
#   - Phase 5: production hardening (e.g. log_statement, ssl, hba_file path)
#
# The file is mounted read-only into the container at
# /etc/postgresql/postgresql.conf and activated via
# `command: postgres -c config_file=/etc/postgresql/postgresql.conf`
# in compose.yml.

# Listen on all container interfaces. Required so the host-side port
# mapping (127.0.0.1:5432:5432 in compose.yml) can reach Postgres —
# the published port arrives on the container's external interface,
# not its loopback. The exposure remains lo-only on the HOST because
# the compose port binding is 127.0.0.1.
listen_addresses = '*'

{# Inline 422 error for an invalid resolution value (ADR-0089). Returned
   with a 4xx status so default HTMX leaves the card in place; the message
   is the audit-legible reason. Context: message. #}
<div class="pf-note pf-note--block" role="alert" data-pf-wd="error">{{ pf_icon("block") }}<p class="pf-note__lead">{{ message }}</p></div>

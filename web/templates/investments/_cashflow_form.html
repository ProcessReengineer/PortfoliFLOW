{# Reusable cashflow form partial.

   Used inside a <dialog> on the detail page. Fields:
   - flow_date (date) — falls back to 12:00 UTC when flow_timestamp is missing
   - flow_kind (plan|actual)
   - flow_type (one of seven)
   - amount (signed number)
   - currency (3-letter ISO)
   - description (optional)
#}

<form id="cashflow-form" class="inv-mini-form">
    <h3>Add Cashflow</h3>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label class="field">
        <span>Date</span>
        <input type="date" name="flow_date" required>
    </label>
    <label class="field">
        <span>Kind</span>
        <select name="flow_kind" required>
            {% for k in flow_kinds %}
                <option value="{{ k }}">{{ k }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="field">
        <span>Flow Type</span>
        <select name="flow_type" required>
            {% for t in flow_types %}
                <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="field">
        <span>Amount</span>
        <input type="number" name="amount" step="0.01" required>
    </label>
    <label class="field">
        <span>Currency</span>
        <input type="text" name="currency" minlength="3" maxlength="3"
               pattern="[A-Za-z]{3}" required
               value="{{ investment.currency }}">
    </label>
    <label class="field">
        <span>Description (optional)</span>
        <input type="text" name="description" maxlength="2000">
    </label>

    <div class="dialog-actions">
        <button type="button" class="btn" data-dismiss="cashflow-dialog">Cancel</button>
        <button type="submit" class="btn btn--primary">Add Cashflow</button>
    </div>
</form>

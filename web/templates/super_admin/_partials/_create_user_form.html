{# Create a new super-admin in the system tenant. #}
<form class="sa-form"
      method="POST"
      action="/super-admin/users">
    <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">

    <div class="sa-form__field">
        <label for="sa-email" class="sa-form__label">Email</label>
        <input id="sa-email" name="email" type="email" required
               class="sa-form__input"
               placeholder="ops@portfoliflow.net">
    </div>

    <div class="sa-form__field">
        <label for="sa-password" class="sa-form__label">
            Initial Password (communicate out of band)
        </label>
        <input id="sa-password" name="password" type="password" required
               class="sa-form__input" minlength="12"
               autocomplete="new-password">
    </div>

    <div class="sa-form__actions">
        <button type="submit" class="sa-button sa-button--primary">
            Create Super-Admin
        </button>
    </div>
</form>
